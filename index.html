<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RN8 Instagram Finds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ecdc;--card:#fffaf0;--ink:#1d241f;--muted:#5f6b62;--line:#e2d7c2;--swamp:#1f3a2e;--sun:#e8743b;--warn:#9a5b12;--warn-bg:#fbebd2;--ok:#2f6b45;--ok-bg:#e1efe4}
@media (prefers-color-scheme:dark){:root{--bg:#141a16;--card:#1d2520;--ink:#ecebe3;--muted:#a7b0a6;--line:#2e3a32;--swamp:#0e1a14;--warn:#f0b56c;--warn-bg:#3a2a14;--ok:#8fd0a3;--ok-bg:#183223}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--swamp);color:#f4ecdc;padding:28px 0 32px}
.kicker{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--sun)}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.1;margin:0}
h1{font-size:clamp(32px,7vw,48px);margin:8px 0 8px;letter-spacing:-.02em}
header p{margin:0;color:#cfdacb}
main{padding:12px 0 60px}
.day{padding:24px 0;border-bottom:2px solid var(--line)}
.day:last-child{border-bottom:0}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h2{font-size:28px;letter-spacing:-.01em}
.count{color:var(--muted);font-size:15px}
h3{font-size:19px;margin:20px 0 10px}
.list{display:grid;gap:12px}
.post{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit}
.post:hover{border-color:var(--sun)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.acct{font-weight:700}
.date{color:var(--muted);font-size:15px}
.post p{margin:6px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:15px}
.empty{color:var(--muted);padding:24px 0}
footer{color:var(--muted);font-size:14px;padding:0 0 40px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="kicker">Rare Native · Instagram search</div>
    <h1>Story reshare finds</h1>
    <p id="sub">Florida wildlife posts found on Instagram, newest search first.</p>
  </div>
</header>

<main class="wrap" id="days"><p class="empty">Loading…</p></main>
<footer class="wrap">Tap a card to open the post on Instagram.</footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const card = p => `
  <a class="post" href="${esc(p.url)}" target="_blank" rel="noopener">
    <div class="top"><span class="acct">@${esc(p.account)}</span><span class="date">${esc(p.posted)}</span></div>
    <p>${esc(p.summary)}</p>
    <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${(p.flags||[]).map(t=>`<span class="tag warn">${esc(t)}</span>`).join('')}</div>
  </a>`;
const chips = a => `<div class="chips">${a.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`;

fetch('finds.json', {cache: 'no-store'}).then(r => r.json()).then(days => {
  days.sort((a, b) => b.date.localeCompare(a.date));
  const total = days.reduce((n, d) => n + d.posts.length, 0);
  document.getElementById('sub').textContent = `${total} posts across ${days.length} search${days.length === 1 ? '' : 'es'}, newest first.`;
  document.getElementById('days').innerHTML = days.map(d => {
    const good = d.posts.filter(p => p.group !== 'check');
    const check = d.posts.filter(p => p.group === 'check');
    const extra = (d.accounts?.length || d.hashtags?.length) ? `
      <details><summary>Sources used</summary>
        ${d.accounts?.length ? `<h3>Accounts</h3>${chips(d.accounts)}` : ''}
        ${d.hashtags?.length ? `<h3>Hashtags</h3>${chips(d.hashtags)}` : ''}
      </details>` : '';
    return `<section class="day">
      <div class="dayhead"><h2>${fmtDay(d.date)}</h2><span class="count">${d.posts.length} post${d.posts.length === 1 ? '' : 's'}</span></div>
      ${good.length ? `<h3>Good to reshare</h3><div class="list">${good.map(card).join('')}</div>` : ''}
      ${check.length ? `<h3>Check first</h3><div class="list">${check.map(card).join('')}</div>` : ''}
      ${d.posts.length ? '' : '<p class="empty">No new posts found.</p>'}
      ${extra}
    </section>`;
  }).join('') || '<p class="empty">No searches yet.</p>';
}).catch(() => { document.getElementById('days').innerHTML = '<p class="empty">Couldn’t load the list.</p>'; });
</script>
</body>
</html>
